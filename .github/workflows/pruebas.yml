name: Pruebas
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test pruebas/vna.test.mjs pruebas/real.test.mjs pruebas/i18n.test.mjs pruebas/ham.test.mjs pruebas/expertos.test.mjs pruebas/expertos2.test.mjs pruebas/patrones.test.mjs pruebas/ajusterlc.test.mjs
      - run: node herramientas/i18n.mjs faltan
