<h1>El grillo de Chirptenna VNA</h1>
<p>Variantes generadas con <code>node img/generar_variantes.mjs</code> a partir de <code>grillo.svg</code>. 23 ilustraciones.</p>
<h2>Niveles de ROE (modo Simple)</h2><div class="rejilla"><figure><img src="variantes/roe-muy-bien.svg" alt="ROE 1–1,5 · Muy bien acoplada"><figcaption><b>ROE 1–1,5 · Muy bien acoplada</b><br><small>Resultado «Muy bien acoplada»: el grillo canta contento</small><br><code>roe-muy-bien.svg</code></figcaption></figure><figure><img src="variantes/roe-aceptable.svg" alt="ROE 1,5–2 · Aceptable"><figcaption><b>ROE 1,5–2 · Aceptable</b><br><small>Resultado «Aceptable»: tranquilo, todo en orden</small><br><code>roe-aceptable.svg</code></figcaption></figure><figure><img src="variantes/roe-mejorable.svg" alt="ROE 2–3 · Mejorable"><figcaption><b>ROE 2–3 · Mejorable</b><br><small>Resultado «Mejorable»: preocupado, con un termómetro</small><br><code>roe-mejorable.svg</code></figcaption></figure><figure><img src="variantes/roe-mal.svg" alt="ROE > 3 · Mal acoplada"><figcaption><b>ROE > 3 · Mal acoplada</b><br><small>Resultado «Mal acoplada»: enredado, chamuscado y con humo</small><br><code>roe-mal.svg</code></figcaption></figure></div>
<h2>Calibración OSL</h2><div class="rejilla"><figure><img src="variantes/osl-open.svg" alt="OPEN · conector abierto"><figcaption><b>OPEN · conector abierto</b><br><small>Paso «OPEN» del asistente de calibración</small><br><code>osl-open.svg</code></figcaption></figure><figure><img src="variantes/osl-short.svg" alt="SHORT · cortocircuito"><figcaption><b>SHORT · cortocircuito</b><br><small>Paso «SHORT» del asistente de calibración</small><br><code>osl-short.svg</code></figcaption></figure><figure><img src="variantes/osl-load.svg" alt="LOAD · 50 Ω"><figcaption><b>LOAD · 50 Ω</b><br><small>Paso «LOAD» del asistente de calibración</small><br><code>osl-load.svg</code></figcaption></figure><figure><img src="variantes/osl-tramos.svg" alt="Calibración por tramos"><figcaption><b>Calibración por tramos</b><br><small>Calibrar «a cachos»: un tramo con cada juego de patrones</small><br><code>osl-tramos.svg</code></figcaption></figure></div>
<h2>Pantallas de estado</h2><div class="rejilla"><figure><img src="variantes/estado-conecta.svg" alt="Conecta tu NanoVNA"><figcaption><b>Conecta tu NanoVNA</b><br><small>Pantalla vacía: antes de conectar el equipo (la imagen del README)</small><br><code>estado-conecta.svg</code></figcaption></figure><figure><img src="variantes/estado-desconectado.svg" alt="Equipo desconectado"><figcaption><b>Equipo desconectado</b><br><small>Se perdió la conexión: el cable cuelga suelto</small><br><code>estado-desconectado.svg</code></figcaption></figure><figure><img src="variantes/estado-midiendo.svg" alt="Midiendo… no muevas el cable"><figcaption><b>Midiendo… no muevas el cable</b><br><small>Barrido en curso: el grillo quieto como una estatua</small><br><code>estado-midiendo.svg</code></figcaption></figure><figure><img src="variantes/estado-alejate.svg" alt="Aléjate de la antena"><figcaption><b>Aléjate de la antena</b><br><small>Cuenta atrás antes de medir: el grillo se aparta</small><br><code>estado-alejate.svg</code></figcaption></figure><figure><img src="variantes/estado-sin-resonancia.svg" alt="Sin resonancia en el rango"><figcaption><b>Sin resonancia en el rango</b><br><small>No se ve ningún mínimo: el grillo busca con una lupa</small><br><code>estado-sin-resonancia.svg</code></figcaption></figure></div>
<h2>Tipos de usuario y de antena</h2><div class="rejilla"><figure><img src="variantes/tipo-multibanda.svg" alt="Antena multibanda con trampas"><figcaption><b>Antena multibanda con trampas</b><br><small>Opción «Mi antena es multibanda»: cada antena lleva sus trampas</small><br><code>tipo-multibanda.svg</code></figcaption></figure><figure><img src="variantes/tipo-meshtastic.svg" alt="Grillo Meshtastic"><figcaption><b>Grillo Meshtastic</b><br><small>Perfil «Mi nodo Meshtastic» (868 y 915 MHz)</small><br><code>tipo-meshtastic.svg</code></figcaption></figure><figure><img src="variantes/tipo-radioaficionado.svg" alt="Radioaficionado"><figcaption><b>Radioaficionado</b><br><small>Bandas HAM: auriculares, micrófono y un manipulador de CW</small><br><code>tipo-radioaficionado.svg</code></figcaption></figure><figure><img src="variantes/tipo-principiante.svg" alt="Principiante"><figcaption><b>Principiante</b><br><small>Para quien empieza: gafas grandes y muchas preguntas</small><br><code>tipo-principiante.svg</code></figcaption></figure><figure><img src="variantes/tipo-experto.svg" alt="Experto en RF"><figcaption><b>Experto en RF</b><br><small>Modo Avanzado: la carta de Smith en la tripa</small><br><code>tipo-experto.svg</code></figcaption></figure></div>
<h2>Ideas técnicas</h2><div class="rejilla"><figure><img src="variantes/tec-curva-real.svg" alt="Las antenas son la curva medida"><figcaption><b>Las antenas son la curva medida</b><br><small>Las antenas de Koch se convierten en la curva de ROE real</small><br><code>tec-curva-real.svg</code></figcaption></figure><figure><img src="variantes/tec-smith.svg" alt="Carta de Smith"><figcaption><b>Carta de Smith</b><br><small>Modo Avanzado: Smith con el trazo de la antena</small><br><code>tec-smith.svg</code></figcaption></figure><figure><img src="variantes/tec-onda-estacionaria.svg" alt="Ondas estacionarias"><figcaption><b>Ondas estacionarias</b><br><small>El origen de la ROE: dos cuerdas con nodos y vientres</small><br><code>tec-onda-estacionaria.svg</code></figcaption></figure><figure><img src="variantes/tec-latiguillo-largo.svg" alt="Latiguillo largo"><figcaption><b>Latiguillo largo</b><br><small>Medir a través de un cable largo: lo enrolla varias veces</small><br><code>tec-latiguillo-largo.svg</code></figcaption></figure><figure><img src="variantes/tec-lupa-banda.svg" alt="Lupa sobre la banda"><figcaption><b>Lupa sobre la banda</b><br><small>Modo de segmentos HF: el grillo mira dónde está la banda (▼)</small><br><code>tec-lupa-banda.svg</code></figcaption></figure></div>
